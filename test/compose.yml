name: fail2ban

services:
  fail2ban:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: "Europe/Paris"
        F2B_LOG_TARGET: "STDOUT"
        F2B_LOG_LEVEL: "INFO"
        F2B_DB_PURGE_AGE: "1d"
        IPTABLES_MODE: ${IPTABLES_MODE:-auto}
        F2B_NO_DEB_DEFAULTS: ""
        FAIL2BAN_IMAGE: ${FAIL2BAN_IMAGE:-tdllllll/fail2ban:edge}
    container_name: ${FAIL2BAN_CONTAINER:-fail2ban}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    read_only: true
    volumes:
      - ./data:/data
      - /var/log:/var/log:ro
      - /run/systemd/journal:/run/systemd/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    tmpfs:
      - /tmp/run/fail2ban
    restart: always
